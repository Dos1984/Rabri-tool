<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RABRI Follow-up Visit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — sticky top bar, single column (max 800px) of collapsible form sections, bottom live-score dock while recording */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#16202b; --muted:#5b6876; --line:#d9dfe5; --scrim:rgba(15,21,27,.45);
  --accent:#1f5f8b; --accent-soft:#e3edf5; --accent-ink:#ffffff;
  --tender:#c2621b; --tender-soft:#fbeadc; --swollen:#2a7f9e; --swollen-soft:#dcf0f6;
  --rem:#2e7d4f; --rem-soft:#e2f2e8; --lda:#6c8a1f; --lda-soft:#eef3dc;
  --mod:#b7791f; --mod-soft:#f8eed9; --high:#b23a3a; --high-soft:#f7e1e1;
  --f-display:"Familjen Grotesk",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --ink:#e6ecf1; --muted:#97a4b1; --line:#2a3642; --scrim:rgba(0,0,0,.6);
  --accent:#6fb0de; --accent-soft:#1c3446; --accent-ink:#0b1620;
  --tender:#f0975a; --tender-soft:#3a2617; --swollen:#62c1e0; --swollen-soft:#15323d;
  --rem:#6fcf97; --rem-soft:#173024; --lda:#b5d35a; --lda-soft:#28301a;
  --mod:#e6b65c; --mod-soft:#33291a; --high:#ef8181; --high-soft:#3a1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --ink:#e6ecf1; --muted:#97a4b1; --line:#2a3642; --scrim:rgba(0,0,0,.6);
  --accent:#6fb0de; --accent-soft:#1c3446; --accent-ink:#0b1620;
  --tender:#f0975a; --tender-soft:#3a2617; --swollen:#62c1e0; --swollen-soft:#15323d;
  --rem:#6fcf97; --rem-soft:#173024; --lda:#b5d35a; --lda-soft:#28301a;
  --mod:#e6b65c; --mod-soft:#33291a; --high:#ef8181; --high-soft:#3a1d1f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:800px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main{max-width:800px;margin:0 auto;padding-block:18px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.banner{font-size:13px;padding:10px 12px;border-radius:var(--r);background:var(--mod-soft);color:var(--ink);border:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.rem,.pill.met{background:var(--rem-soft);color:var(--rem)}
.pill.lda{background:var(--lda-soft);color:var(--lda)}
.pill.mod{background:var(--mod-soft);color:var(--mod)}
.pill.high,.pill.miss{background:var(--high-soft);color:var(--high)}
.pill.none{background:var(--bg);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.pt{background:var(--tender-soft);color:var(--tender)}
.ptsay{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.ptsay p{margin:0;white-space:pre-wrap}
.linkbox{font-family:var(--f-data);font-size:12px;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;user-select:all}

/* patient list */
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--bg)}
.prow .code{font-family:var(--f-data);font-weight:600}
.prow .meta{grid-column:1;font-size:13px;color:var(--muted)}
.prow .right{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px}
.addp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}

/* accordion sections */
.formbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:13px 16px;text-align:left;border-radius:var(--r)}
.sec-h:hover{background:var(--bg)}
.sec-h .t{font-family:var(--f-display);font-weight:600;font-size:16px;margin-right:auto;min-width:0}
.sec-h .sum{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sec-h .cnt{font-family:var(--f-data);font-size:12px;color:var(--muted);white-space:nowrap}
.sec-h .cnt.full{color:var(--rem)}
.chev{flex:none;transition:transform .15s}
.sec[data-open="1"] .chev{transform:rotate(90deg)}
.sec-b{padding:4px 16px 18px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line)}
.sec[data-open="0"] .sec-b{display:none}
.sec-lead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-top:10px}

/* fields */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.inline{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px}
.fld.inline .fl{flex:1 1 220px}
.fld.sub{margin-left:6px;padding-left:14px;border-left:2px solid var(--line)}
.fld.sub2{margin-left:20px;padding-left:14px;border-left:2px solid var(--line)}
.fl{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-width:0}
.fl .u{font-weight:400;color:var(--muted);font-size:12px}
.subhead{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:6px;display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input.bad{border-color:var(--high);background:var(--high-soft)}
textarea{min-height:84px;resize:vertical}
.wrapin{display:flex;gap:6px;align-items:stretch}
.wrapin.ta{align-items:flex-start}
.wrapin>input,.wrapin>textarea,.wrapin>select{flex:1}
.unit{display:flex;align-items:center;font-size:13px;color:var(--muted);font-family:var(--f-data);padding-inline:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button .pts{font-family:var(--f-data);font-size:11px;opacity:.8;margin-left:4px}
.calc{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px dashed var(--line)}
.calc .n{font-family:var(--f-data);font-size:20px;font-weight:600}
.calc .k{font-size:13px;font-weight:600;color:var(--muted)}

/* info + mic buttons */
.info{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:600 12px/1 var(--f-display);display:inline-grid;place-items:center;padding:0}
.mic{flex:none;width:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:grid;place-items:center;min-height:40px;color:var(--muted)}
.mic[aria-pressed="true"]{background:var(--high);border-color:var(--high);color:#fff}
.interim{font-size:12px;color:var(--muted);font-style:italic}

/* VAS 0–10 cm */
.vas{display:flex;gap:10px;align-items:center}
.vas input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.vas input[type=range].unset{opacity:.4}
.vas input[type=number]{width:84px;flex:none}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* joints */
.jtool{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mode button{border:0;background:var(--surface);padding:7px 14px;font-weight:600;font-size:13px}
.mode button[data-m="t"][aria-pressed="true"]{background:var(--tender);color:#fff}
.mode button[data-m="s"][aria-pressed="true"]{background:var(--swollen);color:#fff}
.jcounts{display:flex;gap:14px;margin-left:auto;font-size:13px}
.jcounts b{font-family:var(--f-data);font-size:18px}
.jfig{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr);gap:16px;align-items:center}
@media (max-width:540px){.jfig{grid-template-columns:1fr}}
.jimg{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.jimg svg{width:100%;height:auto;display:block}
.jimg.body svg{max-height:480px}
@media (max-width:540px){.jimg.body svg{max-height:380px}}
.jimg figcaption{display:flex;justify-content:space-around;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fig-line{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fig-txt{fill:var(--muted);font:600 10px var(--f-body);letter-spacing:.06em}
.jt{cursor:pointer}
.jt circle.hit{fill:transparent}
.jt circle.base{fill:#ffffff;fill-opacity:.35;stroke:#16202b;stroke-opacity:.6;stroke-width:1.5px}
.jt circle.t{fill:none;stroke:var(--tender);stroke-width:4px;opacity:0}
.jt circle.s{fill:var(--swollen);opacity:0}
.jt.is-t circle.t{opacity:1}
.jt.is-s circle.s{opacity:.9}
.jt:hover circle.base,.jt:focus-visible circle.base{stroke:var(--accent);stroke-opacity:1;stroke-width:2.5px}
.jt:focus{outline:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}

/* scores */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.score{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.score .n{font-family:var(--f-data);font-size:22px;font-weight:600}
.score .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:800px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dock .live{display:flex;gap:12px;align-items:center;margin-right:auto;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dock .live b{font-family:var(--f-data);font-size:15px;color:var(--ink)}

/* chart + tables */
.chartwrap{overflow-x:auto}
.chart text{font:11px var(--f-data);fill:var(--muted)}
.chart .band-rem{fill:var(--rem-soft)} .chart .band-lda{fill:var(--lda-soft)} .chart .band-mod{fill:var(--mod-soft)} .chart .band-high{fill:var(--high-soft)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .ln2{fill:none;stroke:var(--swollen);stroke-width:2;stroke-dasharray:5 4}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt2{fill:var(--surface);stroke:var(--swollen);stroke-width:2}
table.recs{border-collapse:collapse;width:100%;font-size:13px}
table.recs th,table.recs td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.recs th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
table.recs td.n{font-family:var(--f-data);text-align:right}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:60vh}
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--bg)}
.vitem .d{font-weight:600}
.vitem .s{font-size:13px;color:var(--muted);grid-column:1}
.vitem .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* info sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:460px;width:100%;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:80vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet-card h3{font-size:17px}
.sheet-card p{margin:0;font-size:14px}
.sheet-card ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.sheet .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
@media (max-width:540px){.sheet{align-items:flex-end;padding:0}.sheet-card{border-radius:14px 14px 0 0;max-width:none;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="3" width="24" height="24" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><path d="M9 21 V9 h6 a4 4 0 0 1 0 8 h-6 M15 17 l5 4" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>RABRI Follow-up Visit</b><small>Rheumatoid Arthritis BioRegistry of Ireland</small></div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button data-view="patients" aria-current="true">Patients</button>
    <button data-view="records">Records</button>
  </nav>
</div></header>

<main id="app"></main>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="sheet-card"><div class="row spread" style="flex-wrap:nowrap;align-items:flex-start"><h3 id="sheet-t"></h3><button class="x" id="sheet-x" aria-label="Close">×</button></div><div id="sheet-b" style="display:flex;flex-direction:column;gap:8px"></div></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
// ================= Reference lists =================
const YN=["Yes","No"], YND=["Yes","No","Don't know"];
const EMPLOYED=["Employed full-time","Employed part-time","Self-employed"];
const BIOLOGICS=["Benepali (Etanercept)","Cimzia (Certolizumab pegol)","Enbrel (Etanercept)","Humira (Adalimumab)","Imraldi (Adalimumab)","Inflectra (Infliximab)","Taltz (Ixekizumab)","MabThera (Rituximab)","Olumiant (Baricitinib)","Orencia (Abatacept)","Remicade (Infliximab)","Remsima (Infliximab)","RoActemra (Tocilizumab)","Simponi (Golimumab)","Xeljanz (Tofacitinib)","Other"];
const BIO_STOP=["Inefficacy from the start","Loss of efficacy","Recurring infections","Intolerance","Reaction","Toxicity","Economic","Biosimilar switch","Pregnancy related","Adverse event","Other"];
const BIO_INT=["Infection","Surgery","Reaction","Economic","Prescription lapse"];
const ROUTES=["Oral","Subcutaneous","Infusion"];
const DM_STOP=["Liver toxicity","Gastrointestinal upset","Pregnancy","Nausea","Other"];
const OS_DUR=["1–2 weeks","2–4 weeks","4–6 weeks","6–12 weeks","3–6 months","6–12 months","1–5 years","5–10 years","10+ years"];
const INJ_JOINTS=["Shoulder","Elbow","Wrist","Hip","Knee","Ankle"];
const CANCER_SITES=["Breast","Lung","Colorectal","Prostate","Skin – melanoma","Skin – non-melanoma","Lymphoma","Leukaemia","Cervix / uterus","Bladder / kidney","Other"];
const A10={
  a10_joint:[["1 large joint",0],["2–10 large joints",1],["1–3 small joints",2],["4–10 small joints",3],[">10 joints (≥1 small)",5]],
  a10_sero:[["RF and ACPA negative",0],["Low-positive RF or ACPA",2],["High-positive RF or ACPA",3]],
  a10_apr:[["Normal CRP and ESR",0],["Abnormal CRP or ESR",1]],
  a10_dur:[["Under 6 weeks",0],["6 weeks or more",1]]};

const JOINTS=[["SH","Shoulder"],["EL","Elbow"],["WR","Wrist"],["MCP1","MCP 1"],["MCP2","MCP 2"],["MCP3","MCP 3"],["MCP4","MCP 4"],["MCP5","MCP 5"],["PIP1","Thumb IP"],["PIP2","PIP 2"],["PIP3","PIP 3"],["PIP4","PIP 4"],["PIP5","PIP 5"],["KN","Knee"]];
const JLABEL={}; JOINTS.forEach(([id,l])=>{JLABEL["R_"+id]="Right "+l;JLABEL["L_"+id]="Left "+l;});

// ================= Helpers =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const x=parseFloat(v);return Number.isFinite(x)?x:null};

// ================= Scoring =================
function scores(d){
  const o={};
  if(!d.jointsDone) return o;
  const t=(d.tender||[]).length,s=(d.swollen||[]).length,pg=num(d.ptGA),eg=num(d.prGA),crp=num(d.crp),esr=num(d.esr);
  o.tjc=t;o.sjc=s;
  if(pg!=null&&esr!=null&&esr>0) o.das28esr=0.56*Math.sqrt(t)+0.28*Math.sqrt(s)+0.70*Math.log(esr)+0.014*pg*10;
  if(pg!=null&&crp!=null) o.das28crp=0.56*Math.sqrt(t)+0.28*Math.sqrt(s)+0.36*Math.log(crp+1)+0.014*pg*10+0.96;
  if(pg!=null&&eg!=null) o.cdai=t+s+pg+eg;
  if(o.cdai!=null&&crp!=null) o.sdai=o.cdai+crp/10;
  if(pg!=null&&crp!=null) o.boolean=(t<=1&&s<=1&&crp/10<=1&&pg<=2);
  return o;
}
function cat(kind,x){
  if(x==null) return null;
  const T={das28:[2.6,3.2,5.1],cdai:[2.8,10,22],sdai:[3.3,11,26]}[kind];
  if(kind==="das28") return x<T[0]?"rem":x<=T[1]?"lda":x<=T[2]?"mod":"high";
  return x<=T[0]?"rem":x<=T[1]?"lda":x<=T[2]?"mod":"high";
}
const CATNAME={rem:"Remission",lda:"Low activity",mod:"Moderate",high:"High",none:"Incomplete"};
function primary(sc){
  if(sc.das28crp!=null) return {kind:"DAS28-CRP",val:sc.das28crp,cat:cat("das28",sc.das28crp)};
  if(sc.das28esr!=null) return {kind:"DAS28-ESR",val:sc.das28esr,cat:cat("das28",sc.das28esr)};
  if(sc.cdai!=null) return {kind:"CDAI",val:sc.cdai,cat:cat("cdai",sc.cdai)};
  return {kind:"—",val:null,cat:"none"};
}
function bmi(d){const w=num(d.weight),h=num(d.height);return w&&h?w/((h/100)**2):null}
function whr(d){const w=num(d.waist),h=num(d.hip);return w&&h?w/h:null}
function acr87(d){let y=0,a=0;for(let i=1;i<=7;i++){if(d["a87_"+i])a++;if(d["a87_"+i]==="Yes")y++;}return {y,a}}
function acr10(d){let s=0,a=0;for(const k in A10){const o=A10[k].find(x=>x[0]===d[k]);if(o){s+=o[1];a++;}}return {s,a}}

function dmStarted(code,name,extra){
  const gate=is("dmStart","Yes"), on=and(gate,is("dms_"+code,"Yes"));
  const f=[yn("dms_"+code,name,`Answer Yes if ${name==="Other DMARD"?"another conventional DMARD":name.toLowerCase()} was started since the last visit.`,{sub:1,showIf:gate})];
  if(extra.name) f.push({k:`dms_${code}_name`,label:"Name",type:"text",sub:2,showIf:on,info:"Name of the DMARD (e.g. azathioprine, ciclosporin)."});
  const g=[{k:`dms_${code}_dur`,label:"Duration",unit:"months",type:"number",min:0,max:600,showIf:on,info:"Months on treatment so far."}];
  if(extra.dose) g.push({k:`dms_${code}_dose`,label:extra.max?"Maximum dose reached":"Dose",unit:"mg",type:"number",min:0,step:0.5,showIf:on,info:extra.max?"Highest weekly dose reached, in mg.":"Current dose in mg."});
  f.push({grid:g,sub:2});
  if(extra.route) f.push(extra.route==="seg"?{k:`dms_${code}_route`,label:"Route",type:"seg",opts:["Oral","Subcutaneous"],inline:true,sub:2,showIf:on,info:"How methotrexate is given."}:{k:`dms_${code}_route`,label:"Route",type:"text",sub:2,showIf:on,info:"How the drug is given, e.g. oral."});
  f.push(yn(`dms_${code}_ongoing`,"Still ongoing?","Is the patient still taking it today?",{sub:2,showIf:on}));
  if(extra.disc) f.push({k:`dms_${code}_disc`,label:"Reason for discontinuation",type:"text",dict:1,sub:2,showIf:and(on,is(`dms_${code}_ongoing`,"No")),info:"Why it was stopped."});
  return f;
}
function dmStopped(code,name,extra){
  const gate=is("dmStop","Yes"), on=and(gate,is("dmx_"+code,"Yes"));
  const f=[yn("dmx_"+code,name,`Answer Yes if ${name==="Other DMARD"?"another conventional DMARD":name.toLowerCase()} was stopped since the last visit.`,{sub:1,showIf:gate})];
  if(extra.name) f.push({k:`dmx_${code}_name`,label:"Name",type:"text",sub:2,showIf:on,info:"Name of the DMARD."});
  const g=[{k:`dmx_${code}_dur`,label:"Treatment duration",unit:"months",type:"number",min:0,max:600,showIf:on,info:"Total months on treatment before stopping."}];
  if(extra.max) g.push({k:`dmx_${code}_dose`,label:"Maximum dose reached",unit:"mg",type:"number",min:0,step:0.5,showIf:on,info:"Highest weekly dose reached, in mg."});
  f.push({grid:g,sub:2});
  if(extra.route) f.push({k:`dmx_${code}_route`,label:"Route",type:"seg",opts:["Oral","Subcutaneous"],inline:true,sub:2,showIf:on,info:"How methotrexate was given."});
  f.push({k:`dmx_${code}_why`,label:"Reason stopped",type:"multi",opts:DM_STOP,sub:2,showIf:on,info:"Select all that apply."});
  f.push({k:`dmx_${code}_whyOther`,label:"Other reason",type:"text",dict:1,sub:2,showIf:and(on,is(`dmx_${code}_why`,"Other")),info:"Describe the other reason."});
  return f;
}

const PRE_URL=ON_WEB?new URL("previsit.html",location.href).href.split("#")[0]:"https://claude.ai/artifact/ERzNCr4FH4yMDfuZdR5G5Z";
let standalone=false;
function saveBlob(name,data){const u=URL.createObjectURL(new Blob([data],{type:name.endsWith(".json")?"application/json":"text/csv"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function localDb(){
  const K="rabri-local-db-v1";let data;try{data=JSON.parse(localStorage.getItem(K))||{}}catch(e){return null}
  const subs={};
  const emit=c=>(subs[c]||[]).forEach(cb=>cb({docs:Object.entries(data[c]||{}).map(([id,v])=>({id,data:()=>v})),metadata:{fromCache:false}}));
  return {doc(p){const [c,id]=p.split("/");return {async set(v){const prev=data[c]&&data[c][id];data[c]=data[c]||{};data[c][id]=JSON.parse(JSON.stringify(v));
      try{localStorage.setItem(K,JSON.stringify(data))}catch(e){if(prev)data[c][id]=prev;else delete data[c][id];throw {code:"quota_exceeded"}}emit(c);}}},
    collection(c){return {onSnapshot(cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>emit(c),0);}}}};
}
const slugOf=s=>String(s||"").trim().toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/^-|-$/g,"");
function decodePre(text){
  const m=String(text||"").replace(/\s+/g,"").match(/RABRI1:([A-Za-z0-9+\/=]+):END/);
  if(!m) return null;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));return o&&o.v===1&&o.answers?o:null}catch(e){return null}
}
function applyPre(d,p){
  const from=[],a=p.answers||{},DM=["mtx","ssz","hcq","lef","oth"];
  for(const k in a){if(k.startsWith("pt_")||!FIELDS[k])continue;d[k]=Array.isArray(a[k])?[...a[k]]:String(a[k]);from.push(k);}
  if(a.dmStart==="Yes") DM.forEach(c=>{const k="dms_"+c;d[k]=(a.pt_dmStart||[]).includes(c)?"Yes":"No";from.push(k);});
  if(a.dmStop==="Yes") DM.forEach(c=>{const k="dmx_"+c,y=(a.pt_dmStop||[]).includes(c);d[k]=y?"Yes":"No";from.push(k);
    if(y&&(a.pt_dmStopWhy||[]).length){d[k+"_why"]=[...a.pt_dmStopWhy];from.push(k+"_why");}});
  d.fromPatient=[...new Set([...(d.fromPatient||[]),...from])];
  d.ptSummary=p.summary||"";d.ptQuestions=p.questions||"";d.preCompletedOn=p.completedOn||"";d.preApptDate=p.apptDate||"";
  if(p.apptDate) d.visitDate=p.apptDate;
  return from.length;
}
function preHTML(){
  if(draft.preCompletedOn) return `<section class="panel"><div class="row spread"><div><div class="eyebrow">Patient pre-visit report</div><h2 style="font-size:17px">Completed by the patient ${fmtDate(draft.preCompletedOn.slice(0,10))}</h2></div><span class="pill pt">${(draft.fromPatient||[]).length} answers pre-filled</span></div>
   <div class="ptsay"><b>How the patient has been</b><p>${esc(draft.ptSummary||"Nothing written.")}</p></div>
   ${draft.ptQuestions?`<div class="ptsay"><b>Patient's questions for today</b><p>${esc(draft.ptQuestions)}</p></div>`:""}
   <p class="note">Answers from the patient are marked <span class="pill pt">Patient</span>. Check them with the patient and correct anything that's wrong.</p></section>`;
  return `<section class="panel"><div class="fl"><span>Patient pre-visit report</span>${INFO_BTN("__pre","Pre-visit report")}</div>${importBox("v")}</section>`;
}
function importBox(b){return `<textarea id="imp-${b}" placeholder="Paste the patient's email or reply code here (it starts RABRI1:)" style="min-height:64px"></textarea>
  <div class="row"><button type="button" class="btn sm primary" data-act="importPre" data-box="${b}">Import answers</button><label class="btn sm" style="cursor:pointer">Open .txt file<input type="file" accept=".txt,text/plain" data-impfile="${b}" hidden></label></div>`;}

// ================= Rendering: shell =================
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===(view.name==="records"?"records":"patients"))));
  $("#dock").hidden=view.name!=="visit";
  let h="";
  if(standalone) h+=`<div class="banner">Standalone mode: records are saved only in this browser on this device. Export a JSON backup regularly from Records.</div>`;
  if(status==="offline") h+=`<div class="banner">Records can't be saved in this view. Open the page inside Claude while signed in to store visits. You can still fill in the form.</div>`;
  if(status==="slow") h+=`<div class="banner">Still connecting to the record store. Anything shown may be out of date.</div>`;
  if(live&&!canWrite) h+=`<div class="banner">You have view-only access. Ask the owner for Contributor access to record visits.</div>`;
  if(view.name==="patients") h+=renderPatients();
  else if(view.name==="patient") h+=renderPatient();
  else if(view.name==="visit") h+=renderVisit();
  else if(view.name==="records") h+=renderRecords();
  $("#app").innerHTML=h;
  if(view.name==="visit"){updateAll();}
}
const pvisits=pid=>visits.filter(v=>v.patientId===pid).sort((a,b)=>(a.visitDate||"").localeCompare(b.visitDate||"")||(+a.visitNo||0)-(+b.visitNo||0));
const latest=pid=>pvisits(pid).slice(-1)[0];

function renderPatients(){
  let h="";
  const saved=store.get(DRAFT_KEY);
  if(saved&&saved.draft&&view.name==="patients"){const p=patients.find(x=>x.id===saved.draft.patientId);
    h+=`<div class="banner"><span style="margin-right:auto">Unsaved visit in progress for <b class="num">${esc(p?.rabriId||saved.draft.rabriId||"a patient")}</b>, last edited ${new Date(saved.ts).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})}.</span><button class="btn sm primary" data-act="resume">Resume</button><button class="btn sm" data-act="dropDraft">Discard</button></div>`;}
  h+=`<div class="row spread"><div><div class="eyebrow">Registry</div><h1 style="font-size:26px">Patients</h1></div></div>
  <section class="panel"><div class="addp">
    <label class="fld"><span class="fl">RABRI ID <button class="info" type="button" data-info="__rabriid" aria-label="About RABRI ID">i</button></span><input id="np-id" type="text" autocomplete="off" placeholder="e.g. RABRI-0142"></label>
    <label class="fld"><span class="fl">Hospital / site <button class="info" type="button" data-info="__site" aria-label="About site">i</button></span><input id="np-site" type="text" autocomplete="off" placeholder="e.g. St James's"></label>
    <button class="btn primary" data-act="addPatient" ${canWrite?"":"disabled"}>Add patient</button>
  </div></section>`;
  if(status==="loading"&&!patients.length) return h+`<div class="empty">Loading records…</div>`;
  if(!patients.length) return h+`<div class="empty">No patients yet. Add a patient by RABRI ID above, then record their follow-up visit. No names or hospital numbers are stored.</div>`;
  const sorted=[...patients].sort((a,b)=>(a.rabriId||"").localeCompare(b.rabriId||"",undefined,{numeric:true}));
  h+=`<div class="plist">`;
  for(const p of sorted){
    const lv=latest(p.id), pr=lv?primary(lv.scores||{}):null;
    h+=`<button class="prow" data-act="openPatient" data-id="${esc(p.id)}">
      <span class="code">${esc(p.rabriId)}</span>
      <span class="meta">${p.site?esc(p.site)+" · ":""}${lv?`Visit ${esc(lv.visitNo||"?")} · ${fmtDate(lv.visitDate)}`:"No follow-up visits yet"}${lv&&lv.leftStudy==="Yes"?" · <b>Left study</b>":""}${pvisits(p.id).some(v=>v.status==="pre")?' · <span class="pill pt">Pre-visit report in</span>':""}</span>
      <span class="right">${lv?`<span class="pill ${pr.cat}">${pr.kind} <span class="num">${f2(pr.val)}</span></span>`:`<span class="pill none">No score</span>`}</span>
    </button>`;
  }
  return h+`</div>`;
}

function chartSVG(vs){
  const pts=vs.map(v=>({d:v.visitDate,a:(v.scores||{}).das28esr,b:(v.scores||{}).das28crp})).filter(p=>p.a!=null||p.b!=null);
  if(!pts.length) return `<div class="empty" style="padding:16px">A DAS28 trend appears once a visit has joints, patient global and ESR or CRP recorded.</div>`;
  const W=640,H=210,L=34,R=12,T=10,B=26, all=pts.flatMap(p=>[p.a,p.b]).filter(x=>x!=null), ymax=Math.max(7,Math.ceil(Math.max(...all)));
  const x=i=>pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1);
  const y=v=>T+(H-T-B)*(1-v/ymax);
  const band=(a,b,c)=>`<rect class="band-${c}" x="${L}" width="${W-L-R}" y="${y(b)}" height="${y(a)-y(b)}"/>`;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:420px;width:100%" role="img" aria-label="DAS28 over time">`;
  s+=band(0,2.6,"rem")+band(2.6,3.2,"lda")+band(3.2,5.1,"mod")+band(5.1,ymax,"high");
  [0,2.6,3.2,5.1,ymax].forEach(t=>s+=`<text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`);
  const line=(k,cls,pc)=>{const q=pts.map((p,i)=>({i,v:p[k]})).filter(p=>p.v!=null);if(!q.length)return"";
    return `<path class="${cls}" d="${q.map((p,j)=>(j?"L":"M")+x(p.i)+" "+y(p.v)).join(" ")}"/>`+q.map(p=>`<circle class="${pc}" cx="${x(p.i)}" cy="${y(p.v)}" r="4.5"/>`).join("");};
  s+=line("b","ln2","pt2")+line("a","ln","pt");
  pts.forEach((p,i)=>{if(pts.length<=8||i===0||i===pts.length-1) s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${new Date(p.d+"T12:00:00").toLocaleDateString(undefined,{month:"short",year:"2-digit"})}</text>`;});
  return s+`</svg>`;
}

function renderPatient(){
  const p=patients.find(x=>x.id===view.id); if(!p) return `<button class="btn ghost" data-act="home">← All patients</button><div class="empty">Patient not found.</div>`;
  const vs=pvisits(p.id);
  let h=`<button class="btn ghost" data-act="home" style="align-self:flex-start">← All patients</button>
  <div class="row spread"><div><div class="eyebrow">RABRI patient</div><h1 class="num" style="font-size:26px">${esc(p.rabriId)}</h1><div class="muted" style="font-size:13px">${esc(p.site||"Site not recorded")} · ${vs.length} follow-up visit${vs.length===1?"":"s"}</div></div>
  <button class="btn primary" data-act="newVisit" data-id="${esc(p.id)}" ${canWrite?"":"disabled"}>Record follow-up visit</button></div>
  <section class="panel"><div class="row spread"><h2 style="font-size:17px">DAS28 over time</h2>
  <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>DAS28-ESR</span><span><i class="dot" style="border:2px dashed var(--swollen)"></i>DAS28-CRP</span></div></div>
  <div class="chartwrap">${chartSVG(vs)}</div><p class="note">Bands: remission &lt;2.6 · low ≤3.2 · moderate ≤5.1 · high &gt;5.1</p></section>
  <section class="panel"><div class="fl"><span style="font-family:var(--f-display);font-size:17px">Pre-visit questionnaire</span>${INFO_BTN("__prelink","Pre-visit questionnaire")}</div>
  <div class="note">Send this link to the patient before their appointment:</div>
  <div class="row" style="flex-wrap:nowrap;align-items:stretch"><div class="linkbox" id="plink" style="flex:1;min-width:0">${esc(PRE_URL+"#id-"+slugOf(p.rabriId))}</div><button class="btn sm" data-act="copyLink" data-sel="plink" data-text="${esc(PRE_URL+"#id-"+slugOf(p.rabriId))}">Copy link</button></div>
  <div class="note">When the patient's reply arrives, paste it here. This creates the visit with their answers filled in, ready for clinic.</div>
  ${importBox("p")}</section>
  <section class="panel"><h2 style="font-size:17px">Visits</h2>`;
  if(!vs.length) h+=`<div class="empty" style="padding:16px">No follow-up visits recorded yet.</div>`;
  else{h+=`<div class="vlist">`;[...vs].reverse().forEach(v=>{const s=v.scores||{},pr=primary(s);
    h+=`<div class="vitem"><span class="d">Visit ${esc(v.visitNo||"?")} · ${fmtDate(v.visitDate)}</span>
    <span class="s">TJC28 <span class="num">${s.tjc??"—"}</span> · SJC28 <span class="num">${s.sjc??"—"}</span> · ESR <span class="num">${v.esr??"—"}</span> · CRP <span class="num">${v.crp??"—"}</span> · CDAI <span class="num">${f2(s.cdai)}</span></span>
    <span class="r">${v.status==="pre"?`<span class="pill pt">Awaiting consultation</span>`:`<span class="pill ${pr.cat}">${pr.kind} <span class="num">${f2(pr.val)}</span></span>`}<button class="btn ghost sm" data-act="editVisit" data-id="${esc(v.id)}" ${canWrite?"":"disabled"}>${v.status==="pre"?"Start consultation":"Open"}</button></span></div>`;});
    h+=`</div>`;}
  return h+`</section>`;
}

const INFO_BTN=(key,label)=>`<button class="info" type="button" data-info="${esc(key)}" aria-label="What to enter: ${esc(label)}">i</button>`;
const MIC_SVG=`<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

let calcSeq=0;
function fieldHTML(f){
  if(f.grid) return `<div class="grid ${f.sub===2?"fld sub2":f.sub?"fld sub":""}" data-grid="1">${f.grid.map(fieldHTML).join("")}</div>`;
  if(f.type==="head") return `<div class="subhead">${esc(f.label)}</div>`;
  if(f.type==="calc"){const id="c"+(calcSeq++);f._id=id;CALCS[id]=f;return `<div class="calc" data-calc="${id}"><span class="k">${esc(f.label)}</span>${f.info?INFO_BTN("calc:"+id,f.label):""}<span class="n" data-v>—</span><span class="muted" data-u style="font-size:13px"></span><span class="pill acc" data-c hidden></span></div>`;}
  if(f.type==="joints") return jointsHTML(f);
  if(f.type==="scores") return `<div id="scorebox"></div>`;
  const k=f.k, v=draft[k], cls=["fld"]; if(f.inline) cls.push("inline"); if(f.sub===1)cls.push("sub"); if(f.sub===2)cls.push("sub2");
  const lab=`<span class="fl"><span>${esc(f.label)}${f.unit&&f.type!=="vas"?` <span class="u">(${esc(f.unit)})</span>`:""}${f.type==="vas"?` <span class="u">${esc(f.unit)}</span>`:""}</span>${(draft.fromPatient||[]).includes(k)?'<span class="pill pt">Patient</span>':""}${f.info?INFO_BTN(k,f.label):""}</span>`;
  let ctl="";
  if(f.type==="seg"||f.type==="multi"){
    ctl=`<div class="seg" role="group" aria-label="${esc(f.label)}">${f.opts.map((o,i)=>{const on=f.type==="multi"?(v||[]).includes(o):v===o;
      return `<button type="button" data-seg="${esc(k)}" data-val="${esc(o)}" aria-pressed="${on}">${esc(o)}${f.pts?`<span class="pts">+${f.pts[i][1]}</span>`:""}</button>`}).join("")}</div>`;
  } else if(f.type==="select"){
    ctl=`<select id="f-${k}" data-k="${k}"><option value="">Select…</option>${f.opts.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  } else if(f.type==="number"){
    ctl=`<input id="f-${k}" data-k="${k}" type="number" inputmode="decimal" ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""} step="${f.step||1}" value="${esc(v??"")}" ${f.inline?'style="width:130px"':""}>`;
  } else if(f.type==="date"){
    ctl=`<input id="f-${k}" data-k="${k}" type="date" value="${esc(v??"")}" ${f.inline?'style="width:170px"':""}>`;
  } else if(f.type==="vas"){
    ctl=`<div><div class="vas"><input type="range" id="r-${k}" data-vas="${k}" min="0" max="10" step="0.1" value="${v===""||v==null?5:v}" class="${v===""||v==null?"unset":""}" aria-label="${esc(f.label)} slider"><input id="f-${k}" data-k="${k}" type="number" inputmode="decimal" min="0" max="10" step="0.1" value="${esc(v??"")}" aria-label="${esc(f.label)} in cm"></div><div class="ends"><span>0.0 · ${esc(f.ends[0])}</span><span>10.0 · ${esc(f.ends[1])}</span></div></div>`;
  } else if(f.type==="textarea"){
    ctl=`<div class="wrapin ta"><textarea id="f-${k}" data-k="${k}" placeholder="Type or dictate…">${esc(v??"")}</textarea><button type="button" class="mic" data-mic="${k}" aria-pressed="false" aria-label="Dictate into ${esc(f.label)}">${MIC_SVG}</button></div><div class="interim" id="int-${k}" hidden></div>`;
  } else {
    ctl=`<div class="wrapin"><input id="f-${k}" data-k="${k}" type="text" value="${esc(v??"")}" autocomplete="off">${f.dict?`<button type="button" class="mic" data-mic="${k}" aria-pressed="false" aria-label="Dictate into ${esc(f.label)}">${MIC_SVG}</button>`:""}</div>${f.dict?`<div class="interim" id="int-${k}" hidden></div>`:""}`;
  }
  return `<div class="${cls.join(" ")}" data-fk="${k}">${lab}${ctl}</div>`;
}

function J(id,x,y,r){return `<g class="jt" data-joint="${id}" tabindex="0" role="button" aria-label="${JLABEL[id]}"><circle class="hit" cx="${x}" cy="${y}" r="${r*1.6}"/><circle class="s" cx="${x}" cy="${y}" r="${r}"/><circle class="base" cx="${x}" cy="${y}" r="${r*0.62}" vector-effect="non-scaling-stroke"/><circle class="t" cx="${x}" cy="${y}" r="${r*1.08}" vector-effect="non-scaling-stroke"/></g>`}
function bodySVG(){
  return `<figure class="jimg body"><svg viewBox="0 0 400 1004" aria-label="Large joints: shoulders, elbows, knees"><image href="${IMG_BODY}" width="400" height="1004"/>
  ${Object.entries(PT_BODY).map(([id,[x,y]])=>J(id,x,y,17)).join("")}</svg><figcaption><span>Right</span><span>Left</span></figcaption></figure>`;
}
function handSVG(){
  return `<figure class="jimg hands"><svg viewBox="0 0 1000 711" aria-label="Hand joints and wrists"><image href="${IMG_HANDS}" width="1000" height="711"/>
  ${Object.entries(PT_HANDS).map(([id,[x,y]])=>J(id,x,y,id.endsWith("WR")?26:21)).join("")}</svg><figcaption><span>Right hand</span><span>Left hand</span></figcaption></figure>`;
}
function renderVisit(){
  calcSeq=0;
  const p=patients.find(x=>x.id===draft.patientId);
  let h=`<div class="row spread"><div><div class="eyebrow">${draft.status==="pre"?"Pre-filled by patient · complete at consultation":draft._id?"Editing saved visit":"Recording follow-up visit"}</div><h1 style="font-size:24px" class="num">${esc(p?.rabriId||draft.rabriId||"")}</h1></div>
    <button class="btn ghost" data-act="cancelVisit">Close without saving</button></div>
  <div class="formbar"><button class="btn sm" data-act="expandAll">Expand all</button><button class="btn sm" data-act="collapseAll">Collapse all</button><span class="note" style="margin-left:auto">Draft saved on this device as you type</span></div>`+preHTML();
  for(const s of SECTIONS){
    const open=openSecs[s.id]?1:0;
    h+=`<section class="sec" id="sec-${s.id}" data-sec="${s.id}" data-open="${open}">
      <button type="button" class="sec-h" data-toggle="${s.id}" aria-expanded="${!!open}" aria-controls="secb-${s.id}">
        <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2 L10 7 L5 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="t">${esc(s.title)}</span><span class="sum" data-sum="${s.id}"></span><span class="cnt" data-cnt="${s.id}"></span>
      </button>
      <div class="sec-b" id="secb-${s.id}">
        <div class="sec-lead">${s.lead?`<span style="margin-right:auto">${esc(s.lead)}</span>`:`<span style="margin-right:auto"></span>`}${s.allNo?`<button type="button" class="btn sm" data-allno="${s.id}">Mark rest No</button>`:""}${INFO_BTN("sec:"+s.id,s.title)}</div>
        ${s.fields.map(fieldHTML).join("")}
      </div></section>`;
  }
  h+=`<div class="row spread"><button class="btn" data-act="cancelVisit">Close without saving</button><button class="btn primary" data-act="saveVisit" ${canWrite?"":"disabled"}>Save visit</button></div>`;
  return h;
}

// ================= Live updates (no re-render of inputs) =================
const visible=k=>{const f=FIELDS[k];return !f.showIf||f.showIf(draft)};
function filled(k){const v=draft[k];return Array.isArray(v)?v.length>0:v!==""&&v!=null}
function updateAll(){
  // visibility
  document.querySelectorAll("[data-fk]").forEach(el=>{el.hidden=!visible(el.dataset.fk)});
  document.querySelectorAll("[data-grid]").forEach(g=>{const kids=[...g.querySelectorAll("[data-fk]")];g.hidden=kids.length>0&&kids.every(k=>k.hidden)});
  // section counters
  for(const s of SECTIONS){
    const keys=Object.keys(FIELDS).filter(k=>SEC_OF[k]===s.id&&visible(k));
    let tot=keys.length, got=keys.filter(filled).length;
    if(s.id==="activity"){tot++; if(draft.jointsDone) got++;}
    const c=document.querySelector(`[data-cnt="${s.id}"]`); if(c){c.textContent=`${got}/${tot}`;c.classList.toggle("full",tot>0&&got===tot);}
    const sm=document.querySelector(`[data-sum="${s.id}"]`); if(sm) sm.innerHTML=summary(s.id);
  }
  // calcs
  for(const id in CALCS){const el=document.querySelector(`[data-calc="${id}"]`); if(!el) continue; const r=CALCS[id].fn(draft);
    el.querySelector("[data-v]").textContent=r?r.v:"—"; el.querySelector("[data-u]").textContent=r?r.u:"";
    const c=el.querySelector("[data-c]"); c.hidden=!(r&&r.c); if(r&&r.c) c.textContent=r.c;}
  // joints
  document.querySelectorAll(".jt").forEach(j=>{const id=j.dataset.joint;j.classList.toggle("is-t",(draft.tender||[]).includes(id));j.classList.toggle("is-s",(draft.swollen||[]).includes(id));});
  const jt=$("#jc-t"),js=$("#jc-s"); if(jt){jt.textContent=draft.jointsDone?draft.tender.length:"–";js.textContent=draft.jointsDone?draft.swollen.length:"–";}
  updateScores(); renderDock();
}
function summary(id){
  if(id==="visit") return draft.visitDate?`<span class="pill none">Visit ${esc(draft.visitNo||"?")} · ${fmtDate(draft.visitDate)}</span>`:"";
  if(id==="bio"){const b=bmi(draft);return b?`<span class="pill none">BMI <span class="num">${b.toFixed(1)}</span></span>`:"";}
  if(id==="acr87"){const r=acr87(draft);return r.a?`<span class="pill ${r.y>=4?"acc":"none"}"><span class="num">${r.y}/7</span></span>`:"";}
  if(id==="acr10"){const r=acr10(draft);return r.a?`<span class="pill ${r.s>=6?"acc":"none"}"><span class="num">${r.s}/10</span></span>`:"";}
  if(id==="comorb"){const n=COMORB.filter(c=>draft["cm_"+c[0]]==="Yes").length;return n?`<span class="pill acc">${n} treated</span>`:"";}
  if(id==="activity"){const sc=scores(draft),pr=primary(sc);return pr.val!=null?`<span class="pill ${pr.cat}">${pr.kind} <span class="num">${f2(pr.val)}</span></span>`:"";}
  if(id==="end") return draft.leftStudy==="Yes"?`<span class="pill miss">Leaving study</span>`:"";
  return "";
}

let rec=null, recKey=null;
function stopDict(){if(rec){try{rec.stop()}catch(e){}}}
function dictate(k,btn){
  const el=document.getElementById("f-"+k);
  if(recKey===k){stopDict();return;}
  stopDict();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  el&&el.focus();
  if(!SR){dictHelp(btn);return;}
  let r; try{r=new SR();}catch(e){dictHelp(btn);return;}
  r.lang="en-IE"; r.continuous=true; r.interimResults=true;
  const int=document.getElementById("int-"+k);
  r.onresult=e=>{let fin="",tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else tmp+=t;}
    if(fin){const cur=el.value;el.value=(cur&&!/\s$/.test(cur)?cur+" ":cur)+fin.trim();draft[k]=el.value;changed();}
    if(int){int.hidden=!tmp;int.textContent=tmp;}};
  r.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture","network"].includes(e.error)){dictHelp(btn);}};
  r.onend=()=>{btn.setAttribute("aria-pressed","false");if(int)int.hidden=true;if(rec===r){rec=null;recKey=null;}};
  try{r.start();rec=r;recKey=k;btn.setAttribute("aria-pressed","true");toast("Listening… tap the microphone again to stop");}
  catch(e){dictHelp(btn);}
}

function newDraft(pid){
  const p=patients.find(x=>x.id===pid), lv=latest(pid);
  const d={patientId:pid,rabriId:p?.rabriId||"",visitDate:today(),visitNo:lv&&+lv.visitNo<8?String(+lv.visitNo+1):lv?"":"2",tender:[],swollen:[],jointsDone:false};
  if(lv&&lv.height) d.height=String(lv.height);
  ["a87_1","a87_2","a87_3","a87_4","a87_5","a87_6","a87_7","a10_joint","a10_sero","a10_apr","a10_dur"].forEach(k=>{if(lv&&lv[k])d[k]=lv[k];});
  if(lv&&lv.empStatus){d.empStatus=lv.empStatus;if(lv.empSector)d.empSector=lv.empSector;}
  return d;
}
function startVisit(d){draft=d;view={name:"visit"};render();window.scrollTo(0,0);store.set(DRAFT_KEY,{draft,ts:Date.now()});}
async function act(a,el){
  if(a==="home"){view={name:"patients"};render();}
  if(a==="openPatient"){view={name:"patient",id:el.dataset.id};render();window.scrollTo(0,0);}
  if(a==="newVisit"){const pend=pvisits(el.dataset.id).find(v=>v.status==="pre");
    if(pend){act("editVisit",{dataset:{id:pend.id}});toast("Opened the patient's pre-visit report");return;}
    const s=store.get(DRAFT_KEY);if(s&&s.draft&&!s.draft._id&&s.draft.patientId===el.dataset.id){startVisit(s.draft);toast("Resumed your unsaved draft");}else startVisit(newDraft(el.dataset.id));}
  if(a==="editVisit"){const v=visits.find(x=>x.id===el.dataset.id);if(!v)return;const d=JSON.parse(JSON.stringify(v));d._id=v.id;delete d.id;d.tender=d.tender||[];d.swollen=d.swollen||[];
    for(const k of DATA_KEYS){if(d[k]!=null&&typeof d[k]==="number")d[k]=String(d[k]);}startVisit(d);}
  if(a==="resume"){const s=store.get(DRAFT_KEY);if(s&&s.draft)startVisit(s.draft);}
  if(a==="dropDraft"){store.del(DRAFT_KEY);render();toast("Draft discarded");}
  if(a==="cancelVisit"){stopDict();const pid=draft.patientId,edited=draft._id;draft=null;store.del(DRAFT_KEY);view={name:"patient",id:pid};render();window.scrollTo(0,0);toast(edited?"Changes not saved":"Draft discarded");}
  if(a==="expandAll"||a==="collapseAll"){const o=a==="expandAll"?1:0;SECTIONS.forEach(s=>openSecs[s.id]=o);store.set("rabri-open",openSecs);
    document.querySelectorAll(".sec").forEach(s=>{s.dataset.open=o;s.querySelector(".sec-h").setAttribute("aria-expanded",!!o);});}
  if(a==="noJoints"){draft.tender=[];draft.swollen=[];draft.jointsDone=true;changed();toast("Recorded: no tender or swollen joints");}
  if(a==="clearJoints"){draft.tender=[];draft.swollen=[];draft.jointsDone=false;changed();}
  if(a==="addPatient"){
    const id0=$("#np-id").value.trim(), site=$("#np-site").value.trim();
    if(!id0){toast("Enter a RABRI ID");$("#np-id").focus();return;}
    const id="p_"+slugOf(id0);
    if(patients.some(p=>p.id===id)){toast("That RABRI ID is already listed");view={name:"patient",id};render();return;}
    const rec={rabriId:id0,site,createdAt:new Date().toISOString()};
    const ok=await write("patients/"+id,rec,()=>patients.push({id,...rec}));
    if(ok){view={name:"patient",id};render();toast("Patient added");}
  }
  if(a==="saveVisit") saveVisit();
  if(a==="copyLink"){const t=el.dataset.text;try{await navigator.clipboard.writeText(t);toast("Link copied");}catch(e){const n=document.getElementById(el.dataset.sel);if(n){const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast("Copy isn't available here. The link is selected; copy it yourself.");}}
  if(a==="importPre"){
    const box=document.getElementById("imp-"+el.dataset.box),p=decodePre(box&&box.value);
    if(!p){toast("No reply code found. Paste the whole email, including the part starting RABRI1:");return;}
    const pid=el.dataset.box==="v"?draft.patientId:view.id, pt=patients.find(x=>x.id===pid);
    if(slugOf(p.rabriId)!==slugOf(pt?.rabriId)&&el.dataset.ok!=="1"){el.dataset.ok="1";toast(`This reply is for ${p.rabriId}, not ${pt?.rabriId}. Tap Import again to use it anyway.`);return;}
    if(el.dataset.box==="v"){const n=applyPre(draft,p);render();changed();toast(`${n} answers imported from the patient`);}
    else{draft=newDraft(pid);applyPre(draft,p);await saveVisit("pre");}
  }
  if(a==="export") exportData(el.dataset.fmt);
}
async function saveVisit(status="complete"){
  stopDict();
  if(!draft.visitDate){toast("Enter the visit date");return;}
  if(status==="complete"&&!draft.visitNo){toast("Choose the visit number");openSection("visit");return;}
  const sc=scores(draft), rec={patientId:draft.patientId,rabriId:draft.rabriId,tender:draft.jointsDone?[...draft.tender]:[],swollen:draft.jointsDone?[...draft.swollen]:[],jointsDone:!!draft.jointsDone};
  for(const k of DATA_KEYS){ if(!visible(k)) continue; const f=FIELDS[k], v=draft[k];
    if(v===""||v==null||(Array.isArray(v)&&!v.length)) continue;
    rec[k]=(f.type==="number"||f.type==="vas")?num(v):Array.isArray(v)?[...v]:v; }
  rec.scores=Object.fromEntries(Object.entries(sc).map(([k,v])=>[k,typeof v==="number"?Math.round(v*100)/100:v]));
  const b=bmi(draft),w=whr(draft); if(b) rec.bmi=Math.round(b*10)/10; if(w) rec.whr=Math.round(w*100)/100;
  const r87=acr87(draft), r10=acr10(draft); if(r87.a) rec.acr1987Count=r87.y; if(r10.a===4) rec.acr2010Score=r10.s;
  rec.category=primary(sc).cat; rec.savedAt=new Date().toISOString(); rec.status=status;
  ["fromPatient","ptSummary","ptQuestions","preCompletedOn","preApptDate"].forEach(k=>{if(draft[k]!=null&&draft[k]!=="")rec[k]=draft[k];});
  const id=draft._id||("v_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
  const ok=await write("visits/"+id,rec,()=>{visits=visits.filter(v=>v.id!==id);visits.push({id,...rec});});
  if(ok){const pid=draft.patientId;draft=null;if(status!=="pre")store.del(DRAFT_KEY);view={name:"patient",id:pid};render();window.scrollTo(0,0);
    toast(!live?"Kept for this session only: storage unavailable":status==="pre"?"Pre-visit report saved. It will open when you record the visit.":"Visit saved");}
}
function openSection(id){const s=$("#sec-"+id);if(s){s.dataset.open=1;s.querySelector(".sec-h").setAttribute("aria-expanded","true");s.scrollIntoView({block:"start"});}}
async function write(path,rec,localFn){
  if(!live){localFn();return true;}
  try{await db.doc(path).set(rec);return true;}
  catch(e){
    if(e&&(e.code==="invalid_argument"||e.code==="permission_denied"||e.code==="not_granted")){canWrite=false;toast("You don't have permission to save records");}
    else if(e&&e.code==="quota_exceeded") toast("The record store is full. Export and archive older visits.");
    else toast("Couldn't save. Check your connection and try again. Your draft is kept on this device.");
    return false;
  }
}

// ================= Records + export =================
function renderRecords(){
  const rows=visits.slice().sort((a,b)=>(b.visitDate||"").localeCompare(a.visitDate||""));
  let h=`<div class="row spread"><div><div class="eyebrow">Registry data</div><h1 style="font-size:26px">All visits</h1><div class="muted" style="font-size:13px"><span class="num">${patients.length}</span> patients · <span class="num">${visits.length}</span> visits</div></div>
  <div class="row"><button class="btn" data-act="export" data-fmt="csv">Export CSV</button><button class="btn" data-act="export" data-fmt="json">Export JSON</button>${standalone?`<label class="btn" style="cursor:pointer">Import JSON backup<input type="file" accept=".json,application/json" data-restore="1" hidden></label>`:""}</div></div>`;
  if(!rows.length) return h+`<div class="empty">Saved visits appear here. Every field is kept, so the dataset can be exported for audit or analysis.</div>`;
  const pc=id=>patients.find(p=>p.id===id)?.rabriId||"?";
  h+=`<div class="tablewrap"><table class="recs"><thead><tr><th>Date</th><th>RABRI ID</th><th>Visit</th><th>TJC</th><th>SJC</th><th>ESR</th><th>CRP</th><th>PtGA</th><th>DAS28-ESR</th><th>DAS28-CRP</th><th>CDAI</th><th>Status</th></tr></thead><tbody>`;
  rows.forEach(v=>{const s=v.scores||{},pr=primary(s);
    h+=`<tr><td class="num">${esc(v.visitDate)}</td><td class="num">${esc(pc(v.patientId))}</td><td class="n">${esc(v.visitNo??"")}</td><td class="n">${s.tjc??""}</td><td class="n">${s.sjc??""}</td><td class="n">${v.esr??""}</td><td class="n">${v.crp??""}</td><td class="n">${v.ptGA??""}</td><td class="n">${f2(s.das28esr)}</td><td class="n">${f2(s.das28crp)}</td><td class="n">${f2(s.cdai)}</td><td>${v.status==="pre"?'<span class="pill pt">Awaiting</span>':`<span class="pill ${pr.cat}">${CATNAME[pr.cat]}</span>`}</td></tr>`;});
  return h+`</tbody></table></div><p class="note">The CSV has one row per visit with every form field as a column, plus joint-level tender and swollen sites and all calculated scores.</p>`;
}
function csvCell(v){if(v==null)return"";const s=Array.isArray(v)?v.join("; "):String(v);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
async function exportData(fmt){
  let data,name;
  if(fmt==="json"){data=JSON.stringify({exportedAt:new Date().toISOString(),patients,visits},null,2);name="rabri-followup.json";}
  else{
    const SC=["tjc","sjc","das28esr","das28crp","cdai","sdai","boolean"];
    const cols=["rabri_id","site","visit_record_id",...DATA_KEYS,"tender_joints","swollen_joints","bmi","whr","acr1987Count","acr2010Score",...SC.map(s=>"score_"+s),"category","status","fromPatient","ptSummary","ptQuestions","preCompletedOn","savedAt"];
    const rows=visits.slice().sort((a,b)=>(a.rabriId||"").localeCompare(b.rabriId||"")||(a.visitDate||"").localeCompare(b.visitDate||"")).map(v=>{const p=patients.find(x=>x.id===v.patientId)||{},s=v.scores||{};
      return [p.rabriId||v.rabriId,p.site,v.id,...DATA_KEYS.map(k=>v[k]),v.tender,v.swollen,v.bmi,v.whr,v.acr1987Count,v.acr2010Score,...SC.map(k=>s[k]),v.category,v.status,v.fromPatient,v.ptSummary,v.ptQuestions,v.preCompletedOn,v.savedAt].map(csvCell).join(",");});
    data=[cols.join(","),...rows].join("\n");name="rabri-followup.csv";
  }
  if(!downloads){if(!window.claude){saveBlob(name,data);toast("Export downloaded");}else toast("Export isn't available in this view");return;}
  try{await downloads.save({filename:name,data});toast("Export ready");}
  catch(e){if(e?.code!=="declined")toast("Export isn't available in this view");}
}

// ================= Boot =================
render();
(async()=>{try{downloads=await window.claude?.use?.("downloads");}catch(e){}})();
(async()=>{
  try{db=await window.claude?.use?.("db");}catch(e){db=null}
  if(!db&&!window.claude){db=localDb();if(db)standalone=true;}
  if(!db){status="offline";if(view.name!=="visit")render();return;}
  live=true;
  try{const u=await window.claude.use("user");const c=u?await u.can("data.write"):null;if(c===false)canWrite=false;}catch(e){}
  let gotP=false,gotV=false;
  const timer=setTimeout(()=>{if(!(gotP&&gotV)){status="slow";if(view.name!=="visit")render();}},10000);
  const done=()=>{if(gotP&&gotV){clearTimeout(timer);status="ready";}};
  const rr=()=>{if(view.name!=="visit")render();};
  db.collection("patients").onSnapshot(s=>{patients=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)gotP=true;done();rr();},()=>{clearTimeout(timer);status="offline";live=false;rr();});
  db.collection("visits").onSnapshot(s=>{visits=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)gotV=true;done();rr();},()=>{clearTimeout(timer);status="offline";live=false;rr();});
})();
})();
</script>
</body>
</html>
